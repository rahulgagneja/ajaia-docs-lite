<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajaia Docs Lite</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">A</div>
        <div>
          <strong>Ajaia Docs</strong>
          <span>Lightweight shared drafts</span>
        </div>
      </div>

      <label class="field">
        <span>Working as</span>
        <select id="userSelect"></select>
      </label>

      <button id="newDoc" class="primary">+ New document</button>

      <label class="upload">
        <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown">
        <span>Import .txt or .md</span>
      </label>

      <div class="list-header">
        <span>Documents</span>
        <button id="refreshDocs" title="Refresh documents">↻</button>
      </div>
      <div id="docList" class="doc-list"></div>
    </aside>

    <main class="workspace">
      <section id="emptyState" class="empty-state">
        <h1>Choose or create a document</h1>
        <p>Seeded users make sharing easy to test: Ava owns a launch draft already shared with Ben.</p>
      </section>

      <section id="editorShell" class="editor-shell" hidden>
        <header class="doc-header">
          <div>
            <input id="titleInput" class="title-input" aria-label="Document title">
            <div id="docMeta" class="meta"></div>
          </div>
          <div class="actions">
            <select id="shareSelect" title="Choose user to share with"></select>
            <button id="shareBtn">Share</button>
            <button id="saveBtn" class="primary">Save</button>
          </div>
        </header>

        <nav class="toolbar" aria-label="Formatting toolbar">
          <button data-command="bold" title="Bold"><strong>B</strong></button>
          <button data-command="italic" title="Italic"><em>I</em></button>
          <button data-command="underline" title="Underline"><u>U</u></button>
          <button data-block="h1" title="Heading 1">H1</button>
          <button data-block="h2" title="Heading 2">H2</button>
          <button data-block="p" title="Paragraph">¶</button>
          <button data-command="insertUnorderedList" title="Bulleted list">• List</button>
          <button data-command="insertOrderedList" title="Numbered list">1. List</button>
        </nav>

        <article id="editor" class="editor" contenteditable="true" spellcheck="true"></article>
        <footer class="status-row">
          <span id="status">Ready</span>
          <span id="shareInfo"></span>
        </footer>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
